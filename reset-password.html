<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a New Password — Al-Biruni's Challenge 2026</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#642B36">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="auth-page">
  <aside class="auth-aside">
    <div>
      <a class="brand" href="index.html" style="color:#FFF9EF">
        <span style="width:44px;flex:none" data-emblem-small></span>
        <span class="brand-text">
          <span class="brand-name" style="color:#FFF9EF">Al-Biruni&rsquo;s Challenge</span>
          <span class="brand-sub">2026 &middot; by Mathsimized</span>
        </span>
      </a>
      <h1 style="margin-top:2.5rem">Choose a new password</h1>
      <p>Once you save it, you will be signed in and can return to your competition dashboard.</p>
    </div>
  </aside>

  <main class="auth-main" id="main">
    <div class="auth-card">
      <h1 style="font-size:1.9rem">New password</h1>
      <div data-status></div>
      <form id="rpForm" novalidate>
        <div class="field" id="f-pass">
          <label for="password">New password</label>
          <input class="input" type="password" id="password" autocomplete="new-password" required>
          <div class="field-hint">At least 6 characters.</div>
        </div>
        <div class="field" id="f-pass2">
          <label for="password2">Confirm new password</label>
          <input class="input" type="password" id="password2" autocomplete="new-password" required>
          <div class="field-error">The two passwords do not match.</div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="btn" disabled>Save password</button>
      </form>
      <p class="small muted" style="text-align:center"><a href="login.html">← Back to login</a></p>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/repo.js"></script>
<script src="js/round1.js"></script>
<script src="js/round2.js"></script>
<script src="js/session.js"></script>
<script>
(function () {
  var A = ABC;
  var m = document.querySelector('[data-emblem-small]');
  if (m) m.innerHTML = A.ui.emblemSVG(44).replace('class="emblem"', 'class="emblem" style="margin:0"');

  var form = document.getElementById('rpForm');
  var btn = document.getElementById('btn');
  var status = document.querySelector('[data-status]');
  var mode = A.queryParam('mode') || location.hash;
  var oobCode = A.queryParam('oobCode');
  var verified = false;

  /* Firebase applies the reset link and returns a user once the email
     link has been verified. */
  if (mode === 'resetPassword' || oobCode) {
    status.innerHTML = '<div class="loading-block"><span class="spinner"></span><span>Verifying your reset link…</span></div>';
    var settled = false;
    function fail() {
      if (settled) return;
      settled = true;
      status.innerHTML = A.ui.alertBox('danger', 'This link is no longer valid',
        'Reset links expire after a short time, and can only be used once. Request a new one from the forgot-password page.');
    }
    A.auth.onAuthStateChanged(function (user) {
      if (user) {
        settled = true;
        verified = true;
        btn.disabled = false;
        status.innerHTML = A.ui.alertBox('ok', 'Link verified', 'Choose a new password below.');
        return;
      }
      /* The SDK verifies the emailed code asynchronously, so a null user on
         the first callback is not yet a verdict. Wait before giving up. */
      setTimeout(function () {
        if (!settled) fail();
      }, 2500);
    });
  } else {
    status.innerHTML = A.ui.alertBox('warn', 'Open this page from your email',
      'This page only works when you follow the reset link we emailed you.');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var p1 = document.getElementById('password').value;
    var p2 = document.getElementById('password2').value;
    var bad = false;
    document.getElementById('f-pass').classList.toggle('invalid', p1.length < 6);
    document.getElementById('f-pass2').classList.toggle('invalid', p1 !== p2);
    if (p1.length < 6 || p1 !== p2) { bad = true; }
    if (bad || !verified) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving…';
    /* The user is already signed in by the verified link, so there is no need
       to sign in again. */
    A.auth.currentUser.updatePassword(p1).then(function () {
      status.innerHTML = A.ui.alertBox('ok', 'Password updated',
        'Your password has been changed. Taking you to your dashboard…');
      setTimeout(function () { A.redirect('student/dashboard.html'); }, 1400);
    }).catch(function () {
      status.innerHTML = A.ui.alertBox('danger', '', 'We could not save that password. Please request a new reset link.');
      btn.disabled = false;
      btn.textContent = 'Save password';
    });
  });
})();
</script>
</body>
</html>
