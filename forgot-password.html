<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Al-Biruni's Challenge 2026</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#642B36">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="auth-page">
  <aside class="auth-aside">
    <div>
      <a class="brand" href="index.html" style="color:#FFF9EF">
        <span style="width:44px;flex:none" data-emblem-small></span>
        <span class="brand-text">
          <span class="brand-name" style="color:#FFF9EF">Al-Biruni&rsquo;s Challenge</span>
          <span class="brand-sub">2026 &middot; by Mathsimized</span>
        </span>
      </a>
      <h1 style="margin-top:2.5rem">Reset your password</h1>
      <p>Enter the email address you use for Mathsimized. We will send you a link to choose a new password.</p>
    </div>
  </aside>

  <main class="auth-main" id="main">
    <div class="auth-card">
      <h1 style="font-size:1.9rem">Forgot password</h1>
      <p class="muted small">Your account is shared with Mathsimized, so resetting here resets it there too.</p>
      <div data-status></div>
      <form id="fpForm" novalidate>
        <div class="field" id="f-email">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="btn">Send reset link</button>
      </form>
      <div class="ornament-rule"><span class="glyph" aria-hidden="true">&#952;</span></div>
      <p class="text-center small muted" style="margin:0"><a href="login.html">← Back to login</a></p>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/repo.js"></script>
<script src="js/round1.js"></script>
<script src="js/round2.js"></script>
<script src="js/session.js"></script>
<script>
(function () {
  var A = ABC;
  var m = document.querySelector('[data-emblem-small]');
  if (m) m.innerHTML = A.ui.emblemSVG(44).replace('class="emblem"', 'class="emblem" style="margin:0"');

  var form = document.getElementById('fpForm');
  var btn = document.getElementById('btn');
  var status = document.querySelector('[data-status]');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('f-email').classList.add('invalid');
      return;
    }
    document.getElementById('f-email').classList.remove('invalid');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending…';
    A.session.sendReset(email).then(function () {
      status.innerHTML = A.ui.alertBox('ok', 'Check your inbox',
        'If an account exists for <strong>' + A.esc(email) + '</strong>, a password reset link is on its way. The link may take a minute to arrive — check your spam folder too.');
      form.hidden = true;
    }).catch(function (err) {
      status.innerHTML = A.ui.alertBox('danger', '',
        err && err.code === 'auth/too-many-requests'
          ? 'Too many requests. Please wait a few minutes and try again.'
          : 'We could not send the reset email. Please try again, or contact the Al-Biruni\'s organising team.');
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    });
  });
})();
</script>
</body>
</html>
